<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Sakura – Ứng dụng học tiếng Nhật (từ vựng, kanji, ngữ pháp, luyện nghe & nói).">

  <!-- Cho phép mở toàn màn hình (standalone) khi thêm vào màn hình chính -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#F59E0B">

  <!-- iOS: bắt buộc để icon trên màn hình chính mở app dạng full-screen -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Sakura">
  <link rel="apple-touch-icon" href="icons/Icon-192.png?v=2">
  <link rel="apple-touch-icon" sizes="512x512" href="icons/Icon-512.png?v=2">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png?v=2"/>

  <title>Sakura – Học tiếng Nhật</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    App Check debug token DÙNG CHUNG cho team (bản web demo). Phải đăng ký đúng
    UUID này ở Firebase Console → App Check → app WEB → Manage debug tokens thì
    mới có tác dụng (đăng ký cho app Android KHÔNG áp dụng cho web).
    ⚠️ Token này công khai trong bản deploy → chỉ dùng để DEMO. Bản production
    thật nên đổi sang reCAPTCHA v3 và bỏ dòng dưới.
  -->
  <script>self.FIREBASE_APPCHECK_DEBUG_TOKEN = "00b89c8c-2636-491a-971c-35c1b6d19cdf";</script>

  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
